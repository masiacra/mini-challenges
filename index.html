<!DOCTYPE html>
<html lang="en">
    <head>
        <script src="dist/index.js" defer></script>
    </head>
    <body>
        <form class="awesome-form">
            <div class="value">
                0
            </div>
            <div>
                <button type="button" class="decrement">-</button>
                <button type="button" class="increment">+</button>
            </div>
            <label>
                Increment/Decrement by:
                <input class="incrementer" type="number" value="1" />
            </label>
            <button type="reset" class="reset">
                reset
            </button>
            <label>Keyboard shortcuts: + to increment, - to decrement, Page Up/Down to change step value</label>
        </form>
    </body>
</html>
